[workspace]
resolver = "3"
members = [
    "crates/text",
    "crates/index",
    "crates/query",
    "services/mini",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/suhas-svg/oxdex"

[workspace.dependencies]
oxdex-text = { path = "crates/text" }
oxdex-index = { path = "crates/index" }
oxdex-query = { path = "crates/query" }

unicode-segmentation = "1.12"
rust-stemmers = "1.2"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1"

[profile.release]
debug = 1
