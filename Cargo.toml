[workspace]
resolver = "3"
members = [
    "crates/text",
    "crates/wikitext",
    "crates/docstore",
    "crates/index",
    "crates/query",
    "services/ingest",
    "services/indexer",
    "services/mini",
    "services/search-api",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/suhas-svg/oxdex"

[workspace.dependencies]
oxdex-text = { path = "crates/text" }
oxdex-index = { path = "crates/index" }
oxdex-query = { path = "crates/query" }
oxdex-wikitext = { path = "crates/wikitext" }
oxdex-docstore = { path = "crates/docstore" }

unicode-segmentation = "1.12"
rust-stemmers = "1.2"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1"
thiserror = "2"
quick-xml = "0.37"
bzip2 = "0.6"
zstd = "0.13"
memmap2 = "0.9"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
proptest = "1"
tempfile = "3"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
windows-sys = { version = "0.60", features = ["Win32_System_ProcessStatus", "Win32_System_Threading"] }

[profile.release]
debug = 1
